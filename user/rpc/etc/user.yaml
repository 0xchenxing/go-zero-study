Name: user.rpc
ListenOn: 0.0.0.0:8080
Mode: dev
#Etcd:
#  Hosts:
#  - 127.0.0.1:2379
#  Key: user.rpc
DB:
  DataSource: "root:123456@tcp(127.0.0.1:3306)/user_db?parseTime=true&loc=UTC"  # 主库地址
  DriverName: mysql
  Policy: "round-robin"  # 负载均衡策略：round-robin(轮询) 或 random(随机)
  Replicas:
    - "root:123456@tcp(127.0.0.1:3306)/user_db?parseTime=true&loc=UTC"  # 从库1
    - "root:123456@tcp(127.0.0.1:3306)/user_db?parseTime=true&loc=UTC"  # 从库2
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""
Mongo:
  Uri: "mongodb://127.0.0.1:27017"
  Database: article_db