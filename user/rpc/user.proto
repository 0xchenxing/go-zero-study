syntax = "proto3";

package user;
option go_package = "./user";

message QueryUserReq { int64 id = 1; }
message QueryUserResp {
  int64  id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}

message AuthenticateUserReq { string username = 1; }
message AuthenticateUserResp {
  int64  id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string password = 5;
}

message InsertUserReq {
  string username = 1;
  string password = 2;
  string email = 3;
  string role = 4;
}
message InsertUserResp { int64 id = 1; }

message UpdateUserReq {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}
message UpdateUserResp { bool success = 1; }

message DeleteUserReq { int64 id = 1; }
message DeleteUserResp { bool success = 1; }

message PusherReq {}
message PusherResp {}

service User {
  rpc QueryUser(QueryUserReq) returns(QueryUserResp);
  rpc AuthenticateUser(AuthenticateUserReq) returns(AuthenticateUserResp);
  rpc InsertUser(InsertUserReq) returns(InsertUserResp);
  rpc UpdateUser(UpdateUserReq) returns(UpdateUserResp);
  rpc DeleteUser(DeleteUserReq) returns(DeleteUserResp);
  rpc Pusher(PusherReq) returns(PusherResp);
}
