services:
  postgres:
    image: postgres:17.2
    container_name: postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次创建数据卷时自动执行建表脚本
      - ./rpc/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 显式走 TCP：initdb 阶段 postgres 只开 unix socket，不带 -h 会被误判为已就绪
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U devuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  etcd:
    # 建议升级到更新的补丁版本，例如 v3.5.28
    image: quay.io/coreos/etcd:v3.5.28
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379  # 明确监听地址
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:  # 添加健康检查
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"     # 供宿主机（Go 程序）访问
      - "29092:29092"   # 供容器内其他服务访问（可选暴露，便于调试）
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 定义两个监听器：INTERNAL 给容器内部，EXTERNAL 给宿主机
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # 关键：为每个监听器指定不同的广播地址
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      # 容器内部通过服务名 kafka 访问，走 INTERNAL 监听器
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    # 开启 AOF：JWT 黑名单存在这里，默认只开 RDB 会丢最近的写入
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    # all-in-one 自带 OTLP 接收端（4317 gRPC / 4318 HTTP）和 UI，不需要单独的 otel-collector。
    # 用 latest：本机已缓存该镜像，且经检查它暴露的是 1.x 的端口集（4317/4318/16686），符合预期。
    image: jaegertracing/all-in-one:latest
    # 故意不写 container_name：本机上已存在一个同名（属于别的项目）的 jaeger 容器，
    # 显式命名会撞名导致 compose 起不来。让 compose 自动命名为 user-jaeger-1。
    environment:
      - COLLECTOR_OTLP_ENABLED=true   # 1.x 早期版本需要显式开启；新版默认开启，多设无害
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC，api/rpc 的 Telemetry.Endpoint 指向这里

  # 两个 Go 服务。镜像只做打包：仓库里的 .go 是 E-SafeNet 密文，Docker 读不到明文，
  # 镜内没法 go build。二进制先由宿主机 `bash build.sh` 交叉编译到 build/。
  user-rpc:
    build:
      context: .
      dockerfile: rpc/Dockerfile
    container_name: user-rpc
    ports:
      - "8080:8080"
    depends_on:
      etcd:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # RPC 的 NewServiceContext 失败时是打日志后 return（退出码 0），
    # on-failure 不会重启它，所以 Postgres 依赖靠 depends_on 保证。
    restart: unless-stopped

  user-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: user-api
    ports:
      - "8888:8888"
      - "9091:9091"     # Prometheus /metrics
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-rpc:
        condition: service_started
      jaeger:
        condition: service_started
    # API 用 zrpc.MustNewClient 建客户端（WithBlock，拨号超时 3s），RPC 还没在 etcd
    # 注册时会 logx.Must -> os.Exit(1)，即启动即退出。depends_on 只能保证基础设施就绪，
    # 保证不了 RPC 已注册，所以这里必须靠重启兜底：首次启动重启一两次属正常。
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads-data: