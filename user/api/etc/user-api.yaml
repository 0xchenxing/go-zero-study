Name: user-api
Host: 0.0.0.0
Port: 8888
Middlewares:
  Metrics: true
  Trace: true
  Prometheus: true
Telemetry:
  Name: user
  Endpoint: localhost:4317
  Batcher: otlpgrpc
  Sampler: 1.0
Prometheus:
  Host: 0.0.0.0      # 监听地址，本地调试用 127.0.0.1，生产环境建议 0.0.0.0
  Port: 9091         # 暴露指标的端口，不和主端口 8080 冲突
  Path: /metrics     # 指标路径，默认就是 /metrics

UserRpc:
#  Etcd:
#    Hosts:
#      - 127.0.0.1:2379
#    Key: user.rpc
  Endpoints:
    - 127.0.0.1:8080

Auth:
  AccessSecret: "your-256-bit-secret-key-must-be-32-bytes"
  AccessExpire: 86400  # 24小时
  RefreshSecret: "another-random-secret-key-for-refresh"
  RefreshExpire: 604800  # 7天

# 数据库配置（使用 MySQL）
DB:
  DataSource: "root:123456@tcp(127.0.0.1:3306)/user_db?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"

# Redis 配置（用于黑名单）
Redis:
  Host: "127.0.0.1:6379"
  Pass: ""
  DB: 0